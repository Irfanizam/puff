# CI workflow for Puff.
#
# Runs on every push to main and every pull request.
# Validates the four quality gates from a clean environment:
#   - format:check (Prettier)
#   - lint        (ESLint)
#   - typecheck   (TypeScript)
#   - build       (Next.js production build)
#
# Designed to be the canonical answer to "does this code work everywhere?".
# Cannot be bypassed by --no-verify; branch protection requires green CI to merge.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch.
# Saves CI minutes when force-pushing or pushing rapid iterations.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ─── Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── pnpm setup ──────────────────────────────────────────────────────
      # Install pnpm BEFORE Node so actions/setup-node can use it for caching.
      # Version reads from packageManager field in package.json automatically.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # ─── Node setup ──────────────────────────────────────────────────────
      # Pinned to Node 22 LTS for stability. Update deliberately.
      # The pnpm cache is keyed on pnpm-lock.yaml — automatic cache invalidation
      # when deps change.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # ─── Install ─────────────────────────────────────────────────────────
      # --frozen-lockfile refuses to update pnpm-lock.yaml.
      # Catches the "I changed package.json but forgot to update the lockfile"
      # bug at the gate, before it reaches production.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ─── Turbo cache ─────────────────────────────────────────────────────
      # Speeds up repeat runs. Cached by lockfile + workflow file hashes.
      # First run is full; subsequent runs replay cached task outputs.
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # ─── Format check ────────────────────────────────────────────────────
      # Pure validation — never auto-fixes in CI. Developers must fix locally.
      - name: Format check
        run: pnpm format:check

      # ─── Lint ────────────────────────────────────────────────────────────
      # --max-warnings 0 is already in each workspace's lint script.
      # Any warning fails the build. Enforces zero-warning policy.
      - name: Lint
        run: pnpm lint

      # ─── Typecheck ───────────────────────────────────────────────────────
      # Runs tsc --noEmit across all workspaces via Turbo.
      # Catches type errors that lint can't see (cross-package type imports).
      - name: Typecheck
        run: pnpm typecheck

      # ─── Build ───────────────────────────────────────────────────────────
      # Production build. Catches issues that only surface during bundling
      # (e.g. dynamic import errors, environment variable misuse).
      - name: Build
        run: pnpm build
        env:
          # Hint to Turbo that this is a CI run — affects cache behavior.
          # CI=true is set automatically by GitHub Actions, but explicit is clearer.
          CI: "true"
